<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>똥 캐릭터 · 18개 시안</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f2e8;color:#55381e;font-family:system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:40px 24px 150px}header p{line-height:1.7;color:#896c50}h1{font-size:30px;margin:0}h2{font-size:20px;margin-top:44px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{position:relative;display:block;border:2px solid #e5d6bd;border-radius:20px;overflow:hidden;background:#fffaf0;cursor:pointer}.card:has(input:checked){border-color:#149477;box-shadow:0 0 0 3px #14947733}.card input{position:absolute;top:14px;left:14px;width:20px;height:20px;accent-color:#149477}.card img{display:block;width:100%;aspect-ratio:1;object-fit:contain}.caption{display:block;padding:12px 16px 4px;font-weight:700}.caption b{background:#55381e;color:#fff;padding:3px 8px;border-radius:6px;margin-right:6px}.card a{display:inline-block;margin:8px 16px 16px;font-size:12px;color:#896c50}footer{position:fixed;bottom:0;left:0;right:0;padding:14px 24px;background:#fffaf0f5;border-top:1px solid #dbc7a5;display:flex;gap:12px;align-items:center;justify-content:center}textarea{width:min(720px,80vw);height:54px;resize:none;border:1px solid #dbc7a5;border-radius:10px;padding:9px;color:#55381e;font:inherit;font-size:13px}button{border:0;border-radius:10px;background:#167d68;color:#fff;padding:14px;font-weight:700;cursor:pointer}@media(max-width:600px){main{padding:24px 10px 140px}.grid{gap:6px}.caption{font-size:11px;padding:8px 5px}.caption b{padding:1px 4px;margin:0}.card{border-radius:12px}.card input{top:6px;left:6px;width:16px;height:16px}.card a{font-size:10px;margin:8px 5px}h1{font-size:24px}footer{padding:10px;gap:8px}button{padding:12px 8px}}
</style></head><body><main><header><h1>새로운 똥 캐릭터를 골라주세요</h1><p>6종 × A·B·C = 18개 시안 · 각 줄에서 마음에 드는 안을 선택하세요.<br>선택은 비교용이며 게임에는 반영되지 않습니다. 아래 선택 내용을 복사해 채팅으로 알려주세요.</p></header><section><h2>01 · 피래미똥</h2><div class="grid"><label class="card"><input type="radio" name="g0" value="피래미똥 A"><img src="/exports/character-concepts-2026-11-20/01-피래미똥-A.png" alt="피래미똥 A 작은 물고기형" loading="lazy"><span class="caption"><b>A</b> 작은 물고기형</span><a href="/exports/character-concepts-2026-11-20/01-피래미똥-A.png" target="_blank">원본 크게 보기 ↗</a></label><label class="card"><input type="radio" name="g0" value="피래미똥 B"><img src="/exports/character-concepts-2026-11-20/01-피래미똥-B.png" alt="피래미똥 B 꼬리 달린 꼬마똥" loading="lazy"><span class="caption"><b>B</b> 꼬리 달린 꼬마똥</span><a href="/exports/character-concepts-2026-11-20/01-피래미똥-B.png" target="_blank">원본 크게 보기 ↗</a></label><label class="card"><input type="radio" name="g0" value="피래미똥 C"><img src="/exports/character-concepts-2026-11-20/01-피래미똥-C.png" alt="피래미똥 C 헤엄치는 피래미형" loading="lazy"><span class="caption"><b>C</b> 헤엄치는 피래미형</span><a href="/exports/character-concepts-2026-11-20/01-피래미똥-C.png" target="_blank">원본 크게 보기 ↗</a></label></div></section><section><h2>02 · 푸딩똥</h2><div class="grid"><label class="card"><input type="radio" name="g1" value="푸딩똥 A"><img src="/exports/character-concepts-2026-11-20/02-푸딩똥-A.png" alt="푸딩똥 A 클래식 커스터드" loading="lazy"><span class="caption"><b>A</b> 클래식 커스터드</span><a href="/exports/character-concepts-2026-11-20/02-푸딩똥-A.png" target="_blank">원본 크게 보기 ↗</a></label><label class="card"><input type="radio" name="g1" value="푸딩똥 B"><img src="/exports/character-concepts-2026-11-20/02-푸딩똥-B.png" alt="푸딩똥 B 탱글 젤리 푸딩" loading="lazy"><span class="caption"><b>B</b> 탱글 젤리 푸딩</span><a href="/exports/character-concepts-2026-11-20/02-푸딩똥-B.png" target="_blank">원본 크게 보기 ↗</a></label><label class="card"><input type="radio" name="g1" value="푸딩똥 C"><img src="/exports/character-concepts-2026-11-20/02-푸딩똥-C.png" alt="푸딩똥 C 틀에서 꺼낸 푸딩" loading="lazy"><span class="caption"><b>C</b> 틀에서 꺼낸 푸딩</span><a href="/exports/character-concepts-2026-11-20/02-푸딩똥-C.png" target="_blank">원본 크게 보기 ↗</a></label></div></section><section><h2>03 · 건강똥</h2><div class="grid"><label class="card"><input type="radio" name="g2" value="건강똥 A"><img src="/exports/character-concepts-2026-11-20/03-건강똥-A.png" alt="건강똥 A 매끈한 바나나형" loading="lazy"><span class="caption"><b>A</b> 매끈한 바나나형</span><a href="/exports/character-concepts-2026-11-20/03-건강똥-A.png" target="_blank">원본 크게 보기 ↗</a></label><label class="card"><input type="radio" name="g2" value="건강똥 B"><img src="/exports/character-concepts-2026-11-20/03-건강똥-B.png" alt="건강똥 B 탄탄한 정석형" loading="lazy"><span class="caption"><b>B</b> 탄탄한 정석형</span><a href="/exports/character-concepts-2026-11-20/03-건강똥-B.png" target="_blank">원본 크게 보기 ↗</a></label><label class="card"><input type="radio" name="g2" value="건강똥 C"><img src="/exports/character-concepts-2026-11-20/03-건강똥-C.png" alt="건강똥 C 통통한 S자형" loading="lazy"><span class="caption"><b>C</b> 통통한 S자형</span><a href="/exports/character-concepts-2026-11-20/03-건강똥-C.png" target="_blank">원본 크게 보기 ↗</a></label></div></section><section><h2>04 · 단단똥</h2><div class="grid"><label class="card"><input type="radio" name="g3" value="단단똥 A"><img src="/exports/character-concepts-2026-11-20/04-단단똥-A.png" alt="단단똥 A 압축 돌덩이형" loading="lazy"><span class="caption"><b>A</b> 압축 돌덩이형</span><a href="/exports/character-concepts-2026-11-20/04-단단똥-A.png" target="_blank">원본 크게 보기 ↗</a></label><label class="card"><input type="radio" name="g3" value="단단똥 B"><img src="/exports/character-concepts-2026-11-20/04-단단똥-B.png" alt="단단똥 B 단단한 자갈형" loading="lazy"><span class="caption"><b>B</b> 단단한 자갈형</span><a href="/exports/character-concepts-2026-11-20/04-단단똥-B.png" target="_blank">원본 크게 보기 ↗</a></label><label class="card"><input type="radio" name="g3" value="단단똥 C"><img src="/exports/character-concepts-2026-11-20/04-단단똥-C.png" alt="단단똥 C 각진 뿔형" loading="lazy"><span class="caption"><b>C</b> 각진 뿔형</span><a href="/exports/character-concepts-2026-11-20/04-단단똥-C.png" target="_blank">원본 크게 보기 ↗</a></label></div></section><section><h2>05 · 화산똥</h2><div class="grid"><label class="card"><input type="radio" name="g4" value="화산똥 A"><img src="/exports/character-concepts-2026-11-20/05-화산똥-A.png" alt="화산똥 A 분화구 산형" loading="lazy"><span class="caption"><b>A</b> 분화구 산형</span><a href="/exports/character-concepts-2026-11-20/05-화산똥-A.png" target="_blank">원본 크게 보기 ↗</a></label><label class="card"><input type="radio" name="g4" value="화산똥 B"><img src="/exports/character-concepts-2026-11-20/05-화산똥-B.png" alt="화산똥 B 분출 화산형" loading="lazy"><span class="caption"><b>B</b> 분출 화산형</span><a href="/exports/character-concepts-2026-11-20/05-화산똥-B.png" target="_blank">원본 크게 보기 ↗</a></label><label class="card"><input type="radio" name="g4" value="화산똥 C"><img src="/exports/character-concepts-2026-11-20/05-화산똥-C.png" alt="화산똥 C 쌍봉 화산형" loading="lazy"><span class="caption"><b>C</b> 쌍봉 화산형</span><a href="/exports/character-concepts-2026-11-20/05-화산똥-C.png" target="_blank">원본 크게 보기 ↗</a></label></div></section><section><h2>06 · 용암똥</h2><div class="grid"><label class="card"><input type="radio" name="g5" value="용암똥 A"><img src="/exports/character-concepts-2026-11-20/06-용암똥-A.png" alt="용암똥 A 흐르는 마그마형" loading="lazy"><span class="caption"><b>A</b> 흐르는 마그마형</span><a href="/exports/character-concepts-2026-11-20/06-용암똥-A.png" target="_blank">원본 크게 보기 ↗</a></label><label class="card"><input type="radio" name="g5" value="용암똥 B"><img src="/exports/character-concepts-2026-11-20/06-용암똥-B.png" alt="용암똥 B 용암 슬라임형" loading="lazy"><span class="caption"><b>B</b> 용암 슬라임형</span><a href="/exports/character-concepts-2026-11-20/06-용암똥-B.png" target="_blank">원본 크게 보기 ↗</a></label><label class="card"><input type="radio" name="g5" value="용암똥 C"><img src="/exports/character-concepts-2026-11-20/06-용암똥-C.png" alt="용암똥 C 반쯤 식은 용암형" loading="lazy"><span class="caption"><b>C</b> 반쯤 식은 용암형</span><a href="/exports/character-concepts-2026-11-20/06-용암똥-C.png" target="_blank">원본 크게 보기 ↗</a></label></div></section></main><footer><textarea readonly aria-label="선택한 캐릭터" placeholder="마음에 드는 이미지를 선택하세요"></textarea><button id="copy">선택 복사</button></footer><script>
const summary=document.querySelector('textarea');document.addEventListener('change',()=>{summary.value=[...document.querySelectorAll('input:checked')].map(x=>x.value).join(', ')});document.getElementById('copy').addEventListener('click',async()=>{summary.select();try{await navigator.clipboard.writeText(summary.value);document.getElementById('copy').textContent='복사 완료'}catch{document.getElementById('copy').textContent='선택 내용 복사해주세요'}});
</script></body></html>
